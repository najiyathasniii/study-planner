<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Study Planner</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: #ffffff; width: 100%; max-width: 420px; padding: 40px 32px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; }
        .auth-header { text-align: center; margin-bottom: 28px; }
        .auth-header h2 { font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        .auth-header p { font-size: 14px; color: #64748b; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 14px; color: #94a3b8; font-size: 15px; }
        .input-wrapper input { width: 100%; padding: 12px 14px 12px 42px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .input-wrapper input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .btn-submit { width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: #64748b; }
        .auth-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Reset Password 🔒</h2>
            <p>Enter your account email to receive reset instructions</p>
        </div>

        <form id="forgotPasswordForm" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="forgotEmail">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="forgotEmail" placeholder="student@example.com" autocomplete="off" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            Remembered your password? <a href="login.html">Back to Login</a>
        </div>
    </div>

    <!-- Script file -->
    <script src="scripts.js"></script>
</body>
</html>
